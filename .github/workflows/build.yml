name: Release Dylib

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Setup Theos Environment
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

      - name: Build Dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Prepare Release Asset
        run: |
          mkdir -p release_assets
          cp .theos/obj/*.dylib release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 动态获取 Tag，如果是分支推送或手动触发，则默认使用 v1.0.0 作为标签名
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: AntiCCBDetect ${{ github.ref_name }}
          files: release_assets/*.dylib
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
