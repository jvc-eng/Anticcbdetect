name: Release Dylib

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0、v1.0.1 的 Tag 时自动触发
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发

permissions:
  contents: write # 允许 GitHub Action 创建 Release 和上传文件

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Setup Theos Environment
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

      - name: Build Dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Prepare Release Asset
        run: |
          # 创建发布专用的目录并整理二进制文件
          mkdir -p release_assets
          cp .theos/obj/AntiCCBDetect.dylib release_assets/AntiCCBDetect.dylib

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/AntiCCBDetect.dylib
          name: AntiCCBDetect ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
